<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta
      name="description"
      content="华夏族谱录是一款融合古风视觉、交互式谱系图与 AI 宗法分析的家族族谱管理系统。"
    />
    <meta name="theme-color" content="#b22222" />
    <title>华夏族谱录 | Ancient Genealogy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;700&family=Noto+Sans+SC:wght@300;400;500&family=Ma+Shan+Zheng&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="p-1 md:p-4 h-screen overflow-hidden">
    <div id="root" class="h-full w-full scroll-container shadow-2xl overflow-hidden"></div>

    <svg style="position: absolute; width: 0; height: 0">
      <filter id="ink-bleed">
        <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="noise" />
        <feDisplacementMap
          in="SourceGraphic"
          in2="noise"
          scale="3"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>
    </svg>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
