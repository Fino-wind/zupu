name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: 前端测试
        run: npx vitest run

      - name: 后端 API 测试
        run: npm run test:api

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 镜像能不能构建出来，比任何单元测试都更接近"别人 clone 下来能不能跑"
      - name: 构建镜像
        run: docker build -t chrono-genealogy:ci .
